apply from: "https://raw.githubusercontent.com/Flemmli97/GradleScripts/arch-loom-v2/common.gradle"

loom {
    accessWidenerPath.set project(":fabric").file("src/main/resources/tenshilib.accesswidener")
}

repositories {
    maven {
        name = "SmartBrainLib (SBL) Maven Repo"
        url = "https://dl.cloudsmith.io/public/tslat/sbl/maven/"
    }
}

dependencies {
    modCompileOnly "net.tslat.smartbrainlib:SmartBrainLib-common-${minecraft_version}:${sbl_version}"
}

sourceSets.main.resources {
    srcDir "src/generated/resources"
}